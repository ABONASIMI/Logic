<style>
/* Additional navigation styling */
.top-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  height: var(--topbar-h);
}
.brand-link {
  display: flex;
  align-items: baseline;
  gap: 8px;
  text-decoration: none;
  color: var(--text);
}
.brand-title {
  font-family: var(--font-serif);
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--accent);
}
html[lang="fa"] .brand-title {
  font-family: var(--font-fa);
}
.brand-sub {
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--muted);
  background: var(--code-bg);
  padding: 2px 6px;
  border-radius: 4px;
  border: 1px solid var(--rule);
}
.top-nav {
  display: flex;
  gap: 16px;
}
.nav-link {
  text-decoration: none;
  color: var(--muted);
  font-size: 0.92rem;
  font-weight: 500;
  transition: color 0.15s;
}
.nav-link:hover {
  color: var(--accent);
}
.top-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}
.foot-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 16px;
  text-align: center;
  border-top: 1px solid var(--rule);
  color: var(--muted);
  font-size: 0.9rem;
}
@media (max-width: 768px) {
  .top-nav { display: none; }
}
</style>
